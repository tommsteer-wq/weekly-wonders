<head>

<link rel="canonical" href="https://weeklywonders.live/">

<!-- Link preview, for when this gets pasted into the group chat -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Weekly Wonders">
<meta property="og:url" content="https://weeklywonders.live/">
<meta property="og:title" content="Weekly Wonders 🏆 4th Edition">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Weekly Wonders 🏆 4th Edition">
<meta name="twitter:description" content="Live table, money league, losers league and captain stats — updating every 90 seconds while the gameweek is on.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230B0E14'/><g fill='none' stroke='%23C9A227' stroke-linejoin='round' stroke-linecap='round'><circle cx='50' cy='50' r='44' stroke-width='3' opacity='.5'/><polyline points='24,25 30.5,48 37,36.5 43.5,48 50,25 56.5,48 63,36.5 69.5,48 76,25' stroke-width='7'/><path d='M53.5 56 L36.5 75 L63.5 75 M53.5 56 L53.5 85' stroke-width='7'/></g></svg>">
</head>
<body>

<!--
  WW4 monogram. Defined once, used at every size.
  The "WW" is a single continuous zigzag — a W is a zigzag, so two
  of them joined at the peak make one unbroken line that reads as
  the initials and as a form guide at the same time.
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ww4-mark" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="3" opacity=".5"/>
    <g fill="none" stroke="currentColor" stroke-width="7"
       stroke-linejoin="round" stroke-linecap="round">
      <!-- WW as one unbroken zigzag -->
      <polyline points="24,25 30.5,48 37,36.5 43.5,48 50,25 56.5,48 63,36.5 69.5,48 76,25"/>
      <!-- 4, drawn at the same weight so it holds at 16px -->
      <path d="M53.5 56 L36.5 75 L63.5 75 M53.5 56 L53.5 85"/>
    </g>
  </symbol>
</svg>

<!-- ─────────────────────────── WELCOME ─────────────────────────── -->
<div class="welcome hidden" id="welcome">
  <div class="welcome-inner">
    <div class="welcome-mark"><svg viewBox="0 0 100 100"><use href="#ww4-mark"/></svg></div>
    <h1>Weekly Wonders</h1>
    <div class="sub">4TH EDITION · 2026/27</div>
    <div class="ask">Who are you?</div>
    <div class="who-grid" id="whoGrid"></div>
  </div>
</div>

<!-- ──────────────────────────── HEADER ─────────────────────────── -->
<header class="header">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 100 100"><use href="#ww4-mark"/></svg></div>
    <div class="brand-text">
      <h1>Weekly Wonders</h1>
      <p>4th Edition · 2026/27</p>
    </div>
  </div>

  <div class="header-spacer"></div>

  <div class="season-switch" role="tablist" aria-label="Season">
    <button data-season="2026-27" aria-selected="true">26/27</button>
    <button data-season="2025-26" aria-selected="false">25/26</button>
  </div>

  <span class="live-pill" id="livePill"><span class="live-dot"></span><span class="live-text">Loading</span></span>

  <button class="viewer-chip" id="viewerChip" title="Change who is viewing">
    <span class="avatar">?</span><span class="label">Who are you?</span>
  </button>

  <button class="icon-btn" id="refreshBtn" title="Refresh now" aria-label="Refresh">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
    </svg>
  </button>
</header>

<!-- ───────────────────────────── TABS ──────────────────────────── -->
<nav class="tabbar" id="tabbar"></nav>

<!-- ───────────────────────────── MAIN ──────────────────────────── -->
<main class="main" id="main"></main>

<footer class="main" style="padding-top:0;padding-bottom:40px">
  <div style="border-top:1px solid var(--rule);padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <span class="dim" style="font-size:11.5px">
      Weekly Wonders · 4th Edition · <span id="year">2026</span> ·
      <span id="updated"></span>
    </span>
    <span class="dim" style="font-size:11.5px">
      Data from the official FPL API. Live totals exclude auto-substitutions until a gameweek is final.
    </span>
  </div>
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
