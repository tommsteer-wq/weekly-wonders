<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="description" content="Weekly Wonders — the 4th Edition. Live standings, money league and captain stats for our Fantasy Premier League.">
<title>Weekly Wonders · 4th Edition</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B0E14'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Georgia,serif' fill='%23C9A227'>W</text></svg>">
</head>
<body>

<!-- ─────────────────────────── WELCOME ─────────────────────────── -->
<div class="welcome hidden" id="welcome">
  <div class="welcome-inner">
    <div class="welcome-mark">W</div>
    <h1>Weekly Wonders</h1>
    <div class="sub">4TH EDITION · 2026/27</div>
    <div class="ask">Who are you?</div>
    <div class="who-grid" id="whoGrid"></div>
  </div>
</div>

<!-- ──────────────────────────── HEADER ─────────────────────────── -->
<header class="header">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div class="brand-text">
      <h1>Weekly Wonders</h1>
      <p>4th Edition · 2026/27</p>
    </div>
  </div>

  <div class="header-spacer"></div>

  <div class="season-switch" role="tablist" aria-label="Season">
    <button data-season="2026-27" aria-selected="true">26/27</button>
    <button data-season="2025-26" aria-selected="false">25/26</button>
  </div>

  <span class="live-pill" id="livePill"><span class="live-dot"></span><span class="live-text">Loading</span></span>

  <button class="viewer-chip" id="viewerChip" title="Change who is viewing">
    <span class="avatar">?</span><span class="label">Who are you?</span>
  </button>

  <button class="icon-btn" id="refreshBtn" title="Refresh now" aria-label="Refresh">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
    </svg>
  </button>
</header>

<!-- ───────────────────────────── TABS ──────────────────────────── -->
<nav class="tabbar" id="tabbar"></nav>

<!-- ───────────────────────────── MAIN ──────────────────────────── -->
<main class="main" id="main"></main>

<footer class="main" style="padding-top:0;padding-bottom:40px">
  <div style="border-top:1px solid var(--rule);padding-top:18px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
    <span class="dim" style="font-size:11.5px">
      Weekly Wonders · 4th Edition · <span id="year">2026</span> ·
      <span id="updated"></span>
    </span>
    <span class="dim" style="font-size:11.5px">
      Data from the official FPL API. Live totals exclude auto-substitutions until a gameweek is final.
    </span>
  </div>
</footer>

<script type="module" src="/js/app.js"></script>
</body>
</html>
